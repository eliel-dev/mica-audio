[platformio]
default_envs = esp32s3_devkitc1_dma_exp
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.4
  links2004/WebSockets @ ^2.6.1
  knolleary/PubSubClient @ ^2.8
  adafruit/Adafruit GFX Library @ ^1.12.4
build_flags =
  -DMICA_MATRIX_WIDTH=128
  -DMICA_MATRIX_HEIGHT=64
  -DMICA_STREAM_BINS=128
  -DMICA_PANEL_TYPE_HUB75_P2_5_128X64_SMD2121_SCAN32=1
  -DMICA_PROFILE_DMA_EXP=1
  -DMICA_TEST_LED_GPIO=-1
  -DPIXEL_COLOR_DEPTH_BITS=6
  -DWEBSOCKETS_MAX_DATA_SIZE=32768
  -DMICA_HUB75_MIN_REFRESH_RATE=60

[env:esp32s3_devkitc1_dma_exp]
board = mica_esp32_s3_devkitc1_n16r8
board_build.partitions = partitions/mica_app3M_fat9M_16MB.csv
extra_scripts =
  pre:scripts/patch_websockets_max_data_size.py
  pre:scripts/patch_hub75_bulk_rgb565.py
build_flags =
  ${env.build_flags}
lib_deps =
  ${env.lib_deps}
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#a6221865c71fd5aeba885c31b81fe41bd36c5705

[env:esp32s3_devkitc1_dma_diag]
board = mica_esp32_s3_devkitc1_n16r8
board_build.partitions = partitions/mica_app3M_fat9M_16MB.csv
extra_scripts =
  pre:scripts/patch_websockets_max_data_size.py
  pre:scripts/patch_hub75_bulk_rgb565.py
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=3
  -DMICA_HUB75_DIAGNOSTIC_MODE=1
  -DMICA_HUB75_SHIFT_DRIVER=0
  -DMICA_HUB75_CLKPHASE=0
  -DMICA_HUB75_LATCH_BLANKING=2
lib_deps =
  ${env.lib_deps}
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#a6221865c71fd5aeba885c31b81fe41bd36c5705

[env:esp32s3_devkitc1_dma_oracle_shiftreg]
board = mica_esp32_s3_devkitc1_n16r8
board_build.partitions = partitions/mica_app3M_fat9M_16MB.csv
build_src_filter =
  -<*>
  +<../diagnostics/hub75-oracle/main.cpp>
extra_scripts =
  pre:scripts/patch_websockets_max_data_size.py
  pre:scripts/patch_hub75_bulk_rgb565.py
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=3
  -DMICA_HUB75_DIAGNOSTIC_MODE=1
  -DMICA_HUB75_SHIFT_DRIVER=0
  -DMICA_HUB75_CLKPHASE=0
  -DMICA_HUB75_LATCH_BLANKING=2
lib_deps =
  ${env.lib_deps}
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#a6221865c71fd5aeba885c31b81fe41bd36c5705

[env:esp32s3_devkitc1_dma_oracle_fm6124]
board = mica_esp32_s3_devkitc1_n16r8
board_build.partitions = partitions/mica_app3M_fat9M_16MB.csv
build_src_filter =
  -<*>
  +<../diagnostics/hub75-oracle/main.cpp>
extra_scripts =
  pre:scripts/patch_websockets_max_data_size.py
  pre:scripts/patch_hub75_bulk_rgb565.py
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=3
  -DMICA_HUB75_DIAGNOSTIC_MODE=1
  -DMICA_HUB75_SHIFT_DRIVER=1
  -DMICA_HUB75_CLKPHASE=0
  -DMICA_HUB75_LATCH_BLANKING=2
lib_deps =
  ${env.lib_deps}
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#a6221865c71fd5aeba885c31b81fe41bd36c5705
