services:
  - type: web
    name: mica-audio-server
    runtime: docker
    plan: starter
    dockerfilePath: ./src/MicaAudio.Server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: MICA_SERVER__STORAGEROOT
        value: /data
      - key: MICA_SERVER__RESTRICTTOPRIVATENETWORKS
        value: "false"
      - key: MICA_SERVER__STARTUPPAIRCODETTLSECONDS
        value: "0"
      - key: MICA_SERVER__ADMINTOKEN
        sync: false
      - key: MICA_SERVER__ALLOWLEGACYWEBSOCKETQUERYTOKEN
        value: "false"
      - key: MICA_SERVER__TRUSTEDLANAUTOREGISTRATION
        value: "false"
      - key: MICA_SERVER__DISCOVERYUDPPORT
        value: "5275"
      - key: MICA_SERVER__MAXMEDIAUPLOADBYTES
        value: "20971520"
    disk:
      name: mica-audio-server-data
      mountPath: /data
      sizeGB: 5
